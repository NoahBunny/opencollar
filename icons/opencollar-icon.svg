<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a1550"/>
      <stop offset="0.55" stop-color="#2a0b33"/>
      <stop offset="1" stop-color="#150618"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.34" r="0.72">
      <stop offset="0" stop-color="#7a2d86" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a2d86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7dd8f"/>
      <stop offset="0.5" stop-color="#e6b34e"/>
      <stop offset="1" stop-color="#c98a2c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#glow)"/>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round" filter="url(#soft)">
    <!-- collar: heavy ring, open gap at top center -->
    <path d="M 302.4 93.3 A 150 150 0 1 1 209.6 93.3" stroke-width="36"/>
    <!-- attachment loop joining collar to pendant -->
    <circle cx="256" cy="392" r="17" stroke-width="15"/>
    <!-- O-ring pendant hanging at front -->
    <circle cx="256" cy="446" r="40" stroke-width="21"/>
  </g>

  <!-- subtle top sheen on the collar -->
  <path d="M 302.4 93.3 A 150 150 0 0 0 118 200" fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="8"
        stroke-linecap="round"/>
</svg>
